<div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-bold text-white">Dashboard</h1>
      <button
        (click)="logout()"
        class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition"
      >
        Logout
      </button>
    </div>

    <div class="bg-slate-800 rounded-lg p-6 border border-slate-700">
      <p class="text-slate-200 text-lg">Welcome, <span class="font-bold text-purple-400">{{ userEmail }}</span></p>
      <p class="text-slate-400 mt-2">Your role: <span class="font-medium text-slate-300">{{ userRole }}</span></p>
    </div>
  </div>
</div>
