<div class="survey-detail-page">
  <!-- Header -->
  <div class="survey-header">
    <button class="back-btn" (click)="goBack()">← Back to Dashboard</button>
    <h1 class="survey-title">{{ survey?.title || 'Loading...' }}</h1>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <p>Loading survey...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="error-message">
    <p>{{ error }}</p>
  </div>

  <!-- Survey Content -->
  <div *ngIf="!isLoading && survey" class="survey-container">
    <!-- Survey Info Bar -->
    <div class="survey-info-bar">
      <div class="info-section">
        <p><strong>Description:</strong> {{ survey.description }}</p>
      </div>
      <div class="deadline-section">
        <p><strong>Deadline:</strong> {{ formatDate(survey.endDate) }}</p>
        <span *ngIf="isDeadlinePassed()" class="deadline-passed">⚠️ Deadline has passed</span>
      </div>
    </div>

    <!-- Questions Section -->
    <div class="questions-container">
      <h2>Questions</h2>

      <div *ngFor="let question of survey?.questions; let i = index" class="question-item">
        <h3>{{ i + 1 }}. {{ question.text }}</h3>

        <!-- MCQ Question -->
        <div *ngIf="question.type === 'MCQ'" class="question-content">
          <div class="option-group">
            <label *ngFor="let option of question.options" class="option-label">
              <input
                type="radio"
                [name]="'question_' + question.questionId"
                [value]="option.optionText"
                (change)="updateAnswer(question.questionId, option.optionText)"
              />
              <span>{{ option.optionText }}</span>
            </label>
          </div>
        </div>

        <!-- Rating Question -->
        <div *ngIf="question.type === 'RATING'" class="question-content">
          <div class="rating-group">
            <label *ngFor="let rating of [1, 2, 3, 4, 5]" class="rating-label">
              <input
                type="radio"
                [name]="'question_' + question.questionId"
                [value]="rating.toString()"
                (change)="updateAnswer(question.questionId, rating.toString())"
              />
              <span class="rating-star">{{ '⭐'.repeat(rating) }}</span>
            </label>
          </div>
        </div>

        <!-- Text Question -->
        <div *ngIf="question.type === 'TEXT'" class="question-content">
          <textarea
            class="text-input"
            placeholder="Enter your response..."
            [value]="getAnswer(question.questionId)"
            (change)="updateAnswer(question.questionId, $any($event).target.value)"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="submit-section">
      <button
        class="submit-btn"
        (click)="submitSurvey()"
        [disabled]="!areAllQuestionsAnswered() || isSubmitting || isDeadlinePassed()"
      >
        {{ isSubmitting ? 'Submitting...' : 'Submit Survey' }}
      </button>
      <p *ngIf="!areAllQuestionsAnswered()" class="info-text">
        ⚠️ Please answer all questions to submit
      </p>
    </div>
  </div>
</div>
