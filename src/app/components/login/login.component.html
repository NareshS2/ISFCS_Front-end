<div class="min-h-screen bg-indigo-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    
    <div class="flex justify-center mb-6">
      <div class="bg-indigo-600 p-4 rounded-2xl shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
        </svg>
      </div>
    </div>

    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">SurveyTrack</h1>
      <p class="text-gray-500 mt-2 font-medium">Internal Survey & Feedback Collection System</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-bold text-gray-800 mb-2">Email</label>
        <input 
          type="email" 
          formControlName="email"
          placeholder="your.email@company.com"
          class="w-full px-4 py-3 bg-gray-50 border border-transparent rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none text-gray-700"
        >
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-800 mb-2">Password</label>
        <input 
          type="password" 
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 bg-gray-50 border border-transparent rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none text-gray-700"
        >
      </div>

      <button 
        type="submit" 
        [disabled]="loginForm.invalid"
        class="w-full bg-black text-white font-bold py-3 px-4 rounded-lg hover:bg-gray-800 transition-colors shadow-lg active:transform active:scale-95 disabled:opacity-50"
      >
        Sign In
      </button>
    </form>

  </div>
</div>
